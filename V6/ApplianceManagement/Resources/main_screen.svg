<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <title>Appliance Management</title>

  <!-- backdrop card -->
  <rect x="8" y="8" width="464" height="304" rx="26" fill="#EDF4FB"/>

  <!-- soft decor shapes -->
  <circle cx="58" cy="64" r="24" fill="#D9E9F7"/>
  <circle cx="96" cy="108" r="7" fill="#E4F0FA"/>
  <circle cx="434" cy="72" r="18" fill="#D9E9F7"/>
  <circle cx="408" cy="118" r="6" fill="#E4F0FA"/>
  <circle cx="448" cy="142" r="9" fill="none" stroke="#AED7F1" stroke-width="3"/>

  <!-- storefront -->
  <g transform="translate(140,44)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D8E4F0" stroke-width="2"/>
    <rect x="-12" y="-12" width="224" height="20" rx="8" fill="#2980B9"/>
    <!-- striped awning with scalloped edge -->
    <g>
      <rect x="-8" y="12" width="27" height="14" fill="#2980B9"/><circle cx="5.5" cy="26" r="13" fill="#2980B9"/>
      <rect x="19" y="12" width="27" height="14" fill="#AED7F1"/><circle cx="32.5" cy="26" r="13" fill="#AED7F1"/>
      <rect x="46" y="12" width="27" height="14" fill="#2980B9"/><circle cx="59.5" cy="26" r="13" fill="#2980B9"/>
      <rect x="73" y="12" width="27" height="14" fill="#AED7F1"/><circle cx="86.5" cy="26" r="13" fill="#AED7F1"/>
      <rect x="100" y="12" width="27" height="14" fill="#2980B9"/><circle cx="113.5" cy="26" r="13" fill="#2980B9"/>
      <rect x="127" y="12" width="27" height="14" fill="#AED7F1"/><circle cx="140.5" cy="26" r="13" fill="#AED7F1"/>
      <rect x="154" y="12" width="27" height="14" fill="#2980B9"/><circle cx="167.5" cy="26" r="13" fill="#2980B9"/>
      <rect x="181" y="12" width="27" height="14" fill="#AED7F1"/><circle cx="194.5" cy="26" r="13" fill="#AED7F1"/>
    </g>
    <!-- shop window with goods -->
    <rect x="14" y="42" width="104" height="58" rx="6" fill="#D6E9F8" stroke="#BFD8EC" stroke-width="2"/>
    <rect x="22" y="72" width="22" height="20" rx="3" fill="#F39C12"/>
    <rect x="50" y="68" width="18" height="24" rx="3" fill="#27AE60"/>
    <rect x="74" y="70" width="36" height="22" rx="3" fill="#34495E"/>
    <rect x="88" y="92" width="8" height="3" rx="1.5" fill="#34495E"/>
    <!-- door -->
    <rect x="134" y="46" width="54" height="66" rx="6" fill="#2980B9"/>
    <rect x="142" y="54" width="38" height="36" rx="4" fill="#AED7F1"/>
    <rect x="180" y="76" width="5" height="14" rx="2.5" fill="#FFFFFF"/>
  </g>

  <!-- floor -->
  <rect x="44" y="258" width="392" height="10" rx="5" fill="#DFE9F3"/>

  <!-- refrigerator -->
  <g transform="translate(84,152)">
    <rect x="0" y="0" width="58" height="106" rx="10" fill="#FFFFFF" stroke="#C9D9EA" stroke-width="2.5"/>
    <rect x="4" y="34" width="50" height="4" rx="2" fill="#E4EDF5"/>
    <rect x="44" y="8" width="6" height="20" rx="3" fill="#B8CCE0"/>
    <rect x="44" y="42" width="6" height="16" rx="3" fill="#B8CCE0"/>
    <rect x="8" y="104" width="10" height="7" rx="2.5" fill="#9FB6CC"/>
    <rect x="40" y="104" width="10" height="7" rx="2.5" fill="#9FB6CC"/>
  </g>

  <!-- washing machine -->
  <g transform="translate(210,198)">
    <rect x="0" y="0" width="68" height="62" rx="10" fill="#FFFFFF" stroke="#C9D9EA" stroke-width="2.5"/>
    <rect x="5" y="5" width="58" height="11" rx="5" fill="#E4EDF5"/>
    <circle cx="12" cy="10.5" r="2.5" fill="#2980B9"/>
    <circle cx="20" cy="10.5" r="2.5" fill="#F39C12"/>
    <rect x="44" y="8" width="14" height="5" rx="2.5" fill="#C9D9EA"/>
    <circle cx="34" cy="39" r="17" fill="#AED7F1" stroke="#2980B9" stroke-width="3"/>
    <circle cx="34" cy="39" r="10.5" fill="#EAF3FB"/>
    <path d="M 27 33 A 10 10 0 0 1 35 29" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <rect x="6" y="60" width="10" height="7" rx="2.5" fill="#9FB6CC"/>
    <rect x="52" y="60" width="10" height="7" rx="2.5" fill="#9FB6CC"/>
  </g>

  <!-- television with signal waves -->
  <g transform="translate(314,196)">
    <polygon points="44,54 52,54 56,66 40,66" fill="#7F93A8"/>
    <rect x="28" y="66" width="44" height="6" rx="3" fill="#7F93A8"/>
    <rect x="0" y="0" width="92" height="54" rx="7" fill="#2C3E50"/>
    <rect x="5" y="5" width="82" height="44" rx="4" fill="#3B4A5F"/>
    <rect x="12" y="12" width="30" height="7" rx="3.5" fill="#5DA5D4"/>
    <rect x="12" y="24" width="44" height="7" rx="3.5" fill="#AED7F1"/>
    <rect x="12" y="36" width="22" height="7" rx="3.5" fill="#F39C12"/>
    <circle cx="90" cy="-4" r="3" fill="#27AE60"/>
    <path d="M 83 -9 A 10 10 0 0 1 97 -9" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
    <path d="M 77 -15 A 18 18 0 0 1 103 -15" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <path d="M 66 140 V 158 M 57 149 H 75" fill="none" stroke="#F39C12" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 420 106 V 120 M 413 113 H 427" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
  <circle cx="36" cy="206" r="5" fill="#AED7F1"/>
  <circle cx="452" cy="206" r="4" fill="#5DA5D4"/>
  <circle cx="402" cy="58" r="4" fill="#F39C12"/>
</svg>
