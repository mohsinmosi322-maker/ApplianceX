name: Build ApplianceX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show tree (V6)
        shell: pwsh
        run: |
          Get-ChildItem -Path V6 -Recurse -Filter *.csproj | Select-Object FullName
          Get-ChildItem -Path V6 -Recurse -Filter *.sln | Select-Object FullName

      - name: Build ApplianceManagement
        shell: cmd
        run: |
          msbuild "V6\ApplianceManagement\ApplianceManagement.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal /nologo /p:WarningLevel=1

      - name: Build Authenticator
        shell: cmd
        run: |
          msbuild "V6\Authenticator\Authenticator.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal /nologo /p:WarningLevel=1

      - name: Collect build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path "V6\ApplianceManagement\bin\Release") {
            Copy-Item "V6\ApplianceManagement\bin\Release" "artifacts\ApplianceManagement" -Recurse -Force
          } else {
            Write-Host "WARNING: ApplianceManagement Release output missing"
            Get-ChildItem -Path "V6\ApplianceManagement" -Recurse -Directory | Select-Object FullName
          }
          if (Test-Path "V6\Authenticator\bin\Release") {
            Copy-Item "V6\Authenticator\bin\Release" "artifacts\Authenticator" -Recurse -Force
          } else {
            Write-Host "WARNING: Authenticator Release output missing"
          }
          Get-ChildItem -Path artifacts -Recurse | Select-Object FullName

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApplianceX-Release
          path: artifacts
          if-no-files-found: warn
