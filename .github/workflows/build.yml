name: Build ApplianceX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean old bin / obj / Release folders
        shell: pwsh
        run: |
          $paths = @(
            "V6\ApplianceManagement\bin",
            "V6\ApplianceManagement\obj",
            "V6\Authenticator\bin",
            "V6\Authenticator\obj",
            "V6\Release",
            "artifacts"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing $p"
              Remove-Item -Recurse -Force $p
            }
          }

      - name: Build ApplianceManagement (Release, no PDB)
        shell: cmd
        run: |
          msbuild "V6\ApplianceManagement\ApplianceManagement.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:DebugType=none /p:DebugSymbols=false /v:minimal /nologo

      - name: Build Authenticator (Release, no PDB)
        shell: cmd
        run: |
          msbuild "V6\Authenticator\Authenticator.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:DebugType=none /p:DebugSymbols=false /v:minimal /nologo

      - name: Package separate exe folders (strip symbols)
        shell: pwsh
        run: |
          $root = "V6\Release"
          New-Item -ItemType Directory -Force -Path "$root\ApplianceManagement" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\Authenticator" | Out-Null

          $amSrc = "V6\ApplianceManagement\bin\Release"
          $auSrc = "V6\Authenticator\bin\Release"
          if (-not (Test-Path $amSrc)) { throw "Missing build output: $amSrc" }
          if (-not (Test-Path $auSrc)) { throw "Missing build output: $auSrc" }

          # Ship only runtime files — never PDB / XML docs
          Get-ChildItem $amSrc -File | Where-Object {
            $_.Extension -in '.exe','.dll','.config' -or $_.Name -like '*.dat'
          } | Copy-Item -Destination "$root\ApplianceManagement" -Force

          Get-ChildItem $auSrc -File | Where-Object {
            $_.Extension -in '.exe','.dll','.config' -or $_.Name -like '*.dat'
          } | Copy-Item -Destination "$root\Authenticator" -Force

          Write-Host "=== Package layout ==="
          Get-ChildItem -Path $root -Recurse | Select-Object FullName

          if (-not (Test-Path "$root\ApplianceManagement\ApplianceManagement.exe")) {
            throw "ApplianceManagement.exe not found"
          }
          if (-not (Test-Path "$root\Authenticator\Authenticator.exe")) {
            throw "Authenticator.exe not found"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApplianceX-Release
          path: |
            V6/Release/ApplianceManagement
            V6/Release/Authenticator
          if-no-files-found: error
